name: Sync tiers

# Difficulty changes made in the deployed admin panel are written to R2, and the game treats
# that object as authoritative — so retiering never reaches git on its own. If the object were
# ever lost, every tier would silently revert to whatever the source last said.
#
# This pulls the live tiers back into api/_pieces.js once a day and commits when they differ, so
# the repo always reflects what players are actually getting.
#
# Needs one secret: ADMIN_KEY (the same key the admin panel uses). No storage credentials — the
# script reads through the key-gated admin endpoint rather than R2 directly.

on:
  schedule:
    - cron: '17 4 * * *'      # daily, 04:17 UTC — off the hour to dodge scheduler congestion
  workflow_dispatch:

concurrency:
  group: sync-tiers
  cancel-in-progress: false

permissions:
  contents: write             # needed to push the commit

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull live tiers into the source
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          [ -n "$ADMIN_KEY" ] || { echo "::error::ADMIN_KEY secret is not set"; exit 1; }
          node tools/sync-tiers.js

      # Guard against a corrupt rewrite. Deliberately not test.js: that pulls in _engine.js and
      # the AWS SDK, which would mean installing the whole dependency tree to check one edited
      # file. _pieces.js has no dependencies, and an empty tier is the failure that matters.
      - name: Verify the pool still loads
        run: |
          node -e "
            const { PIECES } = require('./api/_pieces.js');
            const n = t => PIECES[t].length;
            const total = n('easy') + n('medium') + n('hard');
            console.log('easy ' + n('easy') + ' · medium ' + n('medium') + ' · hard ' + n('hard') + ' · total ' + total);
            for (const t of ['easy','medium','hard']) if (!n(t)) { console.error('::error::tier ' + t + ' is empty'); process.exit(1); }
            if (total < 100) { console.error('::error::only ' + total + ' pieces — refusing a suspicious rewrite'); process.exit(1); }
          "

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- api/_pieces.js; then
            echo "tiers already in sync — nothing to commit"
            exit 0
          fi
          git config user.name  "ChinesePrince07"
          git config user.email "chineseprince07@users.noreply.github.com"
          git add api/_pieces.js
          # Two -m flags rather than an embedded newline: a multi-line string here has to stay
          # indented inside the YAML block scalar, and unindented body lines silently break it.
          git commit \
            -m "Sync difficulty tiers from the admin panel" \
            -m "Retiering done in the deployed panel lives in R2, which overrides the source. This is that state written back so the repo matches what players actually get."
          git push
          echo "pushed updated tiers"
