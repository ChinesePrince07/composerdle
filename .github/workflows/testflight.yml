name: TestFlight

# Build Composerdle with a RELEASE Xcode on a GitHub macOS runner and upload it to
# TestFlight / App Store Connect.
#
# Why CI rather than the local Mac: Apple will not accept App Store builds made with a beta
# Xcode, and Xcode 26 does not run on macOS 27. The build Mac is on macOS 27 beta, so it can
# only run Xcode 27 beta — a combination that cannot ship. The macos-26 runner has release
# Xcode 26, which can.
#
# Signing needs no certificate wrangling: -allowProvisioningUpdates lets xcodebuild create and
# download the distribution certificate and provisioning profile itself, authenticated with an
# App Store Connect API key. That matters here because the usual way to create those assets is
# Xcode on a Mac, which is exactly what is unavailable.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     – App Store Connect API key id       (e.g. ABC123XYZ9)
#   ASC_ISSUER_ID  – the issuer id shown above the key  (a UUID)
#   ASC_KEY_P8     – full contents of AuthKey_<KEYID>.p8, BEGIN/END lines included
# The key needs the App Manager role, or it cannot create signing assets.

on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "What to Test note for this TestFlight build"
        required: false
        default: "Bug fixes and new pieces."
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/UITests/**'          # screenshot tooling ships nothing — no need to upload a build
      - '.github/workflows/testflight.yml'

concurrency:
  group: testflight-composerdle
  cancel-in-progress: false      # never cancel a run that may already have uploaded

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: Composerdle
      BUNDLE_ID: org.andypandy.composerdle
      TEAM_ID: R696Q88HS7
      # The secrets context is not usable in a step-level `if`, but it is in job env — so the
      # presence check is resolved here and the step tests the resulting flag.
      HAS_DIST_CERT: ${{ secrets.IOS_DIST_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      # macos-26 ships several Xcode 26.x. Take the newest RELEASE one and never a beta,
      # because App Store review rejects builds from pre-release toolchains.
      - name: Select release Xcode 26
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -iv beta | sort -V | tail -1 || true)"
          [ -n "$XC" ] || XC="$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)"
          echo "using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The key is written under RUNNER_TEMP (destroyed with the runner) and into the directory
      # altool searches. It never enters the workspace and is never printed.
      - name: Stage App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 secret is empty"; exit 1; }
          [ -n "$ASC_KEY_ID" ] || { echo "::error::ASC_KEY_ID secret is empty"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys" ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/

      # Without a certificate of our own, -allowProvisioningUpdates mints a NEW distribution
      # certificate every run: its private key is created in the runner's keychain, which is
      # destroyed with the job, so the next run cannot find a key and asks Apple for another.
      # Apple caps distribution certificates per account, and we hit that cap after five builds.
      #
      # Importing one long-lived certificate fixes it for good — cloud signing then only has to
      # fetch the provisioning profile, which is unlimited. Skipped when the secrets are absent,
      # so the previous path still works until they are added.
      - name: Import distribution certificate
        if: env.HAS_DIST_CERT == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          # Diagnose before importing: `security` reports every failure as "wrong password?",
          # which hides a truncated or stale blob. These checks name the actual fault without
          # printing either secret.
          echo "decoded p12: $(wc -c < "$RUNNER_TEMP/dist.p12") bytes"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -noout -passin pass: 2>/dev/null; then
            if openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -noout -passin env:P12_PW 2>/dev/null; then
              echo "p12 is valid and IOS_DIST_P12_PASSWORD matches it"
            else
              echo "::error::the p12 does not open with IOS_DIST_P12_PASSWORD."
              echo "Either IOS_DIST_P12 still holds an older file, or the password differs."
              echo "Regenerate and re-upload BOTH secrets together:"
              echo "  openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout pass:PW"
              echo "  base64 -i dist.p12 | pbcopy   # -> IOS_DIST_P12"
              exit 1
            fi
          else
            echo "::warning::p12 has an empty password; importing with an empty passphrase"
            P12_PW=""
          fi

          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without the partition list, codesign cannot use the imported key and prompts —
          # which on a headless runner just hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "identities available to codesign:"
          security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(.*\)"/  \1/p'

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # github.run_number gives a strictly increasing build number, which App Store Connect
      # requires — it rejects a build whose version+build pair already exists.
      - name: Archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Composerdle.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Composerdle.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION=1.0
          test -d "$RUNNER_TEMP/Composerdle.xcarchive" || { echo "::error::archive not produced"; exit 1; }

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Composerdle.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      # Validate first: a bad binary caught here reports a clear reason, whereas a rejected
      # upload often does not.
      - name: Validate and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "uploading $(basename "$IPA") — build ${{ github.run_number }}"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Uploaded to App Store Connect"
            echo ""
            echo "- version **1.0**, build **${{ github.run_number }}**"
            echo "- bundle \`${{ env.BUNDLE_ID }}\`"
            echo ""
            echo "Processing takes a few minutes. Internal TestFlight testers get it as soon as"
            echo "processing finishes; external testers need Beta App Review on the first build"
            echo "of each version."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: |
            ${{ runner.temp }}/Composerdle.xcarchive/Info.plist
            ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 5
